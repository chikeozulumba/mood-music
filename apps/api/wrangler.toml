name = "mood-music"
main = "src/index.ts"
compatibility_date = "2026-09-12"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "USER_STATE"
class_name = "UserState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserState"]

# Create this namespace once with:
#   wrangler kv namespace create MOOD_MUSIC_SESSIONS
#   wrangler kv namespace create MOOD_MUSIC_SESSIONS --preview
# then paste the returned ids below.
[[kv_namespaces]]
binding = "MOOD_MUSIC_SESSIONS"
id = "fef199fbdb07444e9c1ac7a9c6d1607b"
preview_id = "1849c801d0914b28b3edefe4b48777d1"

[vars]
# Non-secret. This is the production value (used by `wrangler deploy`).
# Local dev overrides it back to localhost via apps/api/.env.local.
SPOTIFY_REDIRECT_URI = "https://mood-music-api.chike-ozulumba.workers.dev/api/auth/callback"

# Secrets — never stored in this file.
# Local dev: create apps/api/.dev.vars (gitignored) from .dev.vars.example.
# Production: `wrangler secret put ANTHROPIC_API_KEY` / SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET
